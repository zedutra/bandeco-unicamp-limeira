name: CI & Release (.deb)

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Testes Unitários
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar suíte de testes
        run: python -m unittest discover -s tests -v

  build-deb-and-release:
    name: Gerar Pacote .deb e Publicar Release
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Instalar dependências de empacotamento Debian (stdeb)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-stdeb \
            fakeroot \
            python3-all \
            python3-setuptools \
            dh-python \
            debhelper \
            python3-requests \
            python3-bs4

      - name: Sincronizar versão com a tag Git (se aplicável)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/version=\"[^\"]*\"/version=\"${VERSION}\"/" setup.py
          sed -i "s/version = \"[^\"]*\"/version = \"${VERSION}\"/" pyproject.toml
          sed -i "s/__version__ = \"[^\"]*\"/__version__ = \"${VERSION}\"/" bandeco/__init__.py

      - name: Construir pacote .deb
        run: |
          python3 setup.py --command-packages=stdeb.command bdist_deb
          ls -la deb_dist/

      - name: Testar instalação do pacote .deb gerado
        run: |
          sudo apt-get install -y ./deb_dist/*.deb
          bandeco --help

      - name: Salvar pacote .deb como artefato do workflow
        uses: actions/upload-artifact@v4
        with:
          name: pacote-deb
          path: deb_dist/*.deb

      - name: Criar GitHub Release e anexar pacote .deb
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: deb_dist/*.deb
          generate_release_notes: true
